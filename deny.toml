# Reviewed dependency sources, licenses and advisories; no exceptions at bootstrap.
[advisories]
ignore = []
unmaintained = "all"
unsound = "all"

[licenses]
# ISC: ring/untrusted; BSD-3-Clause: subtle; MIT/Unicode-3.0: upstream PDU/parser macros.
allow = ["Apache-2.0", "ISC", "BSD-3-Clause", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
# Duplicate versions are a hygiene signal, not a security advisory. The 7 duplicate
# families (block-buffer, const-oid, crypto-common, der, digest, spki, syn) are transitive
# via the pinned IronRDP rev (ironrdp-pdu/ironrdp-displaycontrol). Warn until upstream
# dedupes; revisit then and restore "deny". Advisories, licenses, sources and wildcards stay strict.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = ["https://github.com/Devolutions/IronRDP"]
