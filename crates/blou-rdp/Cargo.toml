[package]
name = "blou-rdp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Pinned upstream RDP/TLS adapters for Blou"

[lints]
workspace = true

[dependencies]
blou-core = { path = "../blou-core", version = "=0.1.0" }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
ironrdp-core = { version = "=0.2.1", git = "https://github.com/Devolutions/IronRDP", rev = "e4143f26306a6639a889d80c1c484ca69c365a8f", features = ["std"] }
ironrdp-displaycontrol = { version = "=0.8.0", git = "https://github.com/Devolutions/IronRDP", rev = "e4143f26306a6639a889d80c1c484ca69c365a8f" }
ironrdp-connector = { version = "=0.10.0", git = "https://github.com/Devolutions/IronRDP", rev = "e4143f26306a6639a889d80c1c484ca69c365a8f" }
ironrdp-pdu = { version = "=0.9.0", git = "https://github.com/Devolutions/IronRDP", rev = "e4143f26306a6639a889d80c1c484ca69c365a8f", features = ["std"] }

[dev-dependencies]
ring = "=0.17.14"
ironrdp-tls = { version = "=0.2.2", git = "https://github.com/Devolutions/IronRDP", rev = "e4143f26306a6639a889d80c1c484ca69c365a8f", default-features = false, features = ["rustls-ring"] }
