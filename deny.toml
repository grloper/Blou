# Reviewed dependency sources, licenses and advisories; no exceptions at bootstrap.
[advisories]
ignore = []
unmaintained = "all"
unsound = "all"

[licenses]
# ISC: ring/untrusted; BSD-3-Clause: subtle. Other dependencies offer Apache-2.0.
allow = ["Apache-2.0", "ISC", "BSD-3-Clause"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
